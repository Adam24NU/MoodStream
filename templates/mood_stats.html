{% extends "base.html" %}

{% block title %}Mood Stats — Moodify{% endblock %}

{% block content %}
<div class="chart-container">
    <h2>Your Mood History</h2>
    <p class="chart-subtitle">A breakdown of the moods you have tracked so far.</p>
    <canvas id="moodChart" role="img" aria-label="Bar chart of mood counts"></canvas>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% endblock %}
